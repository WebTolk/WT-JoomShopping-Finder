PLG_FINDER_WTJOOMSHOPPINGFINDER="Smart Search - JoomShopping products"
PLG_WTJOOMSHOPPINGFINDER_DESC="<p>Indexes JoomShopping products, characteristics and attributes for Joomla Smart Search.</p>"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_CHARACTERISTICS_DESC="Adds JoomShopping product characteristics to the searchable text. The index receives the characteristic name and selected/displayed value returned by JoomShopping for this product and current language. Characteristic descriptions are not indexed."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_CHARACTERISTICS_LABEL="Index characteristics"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_CHARACTERISTIC_NAMES_DESC="Controls whether characteristic names are added next to characteristic values. Enabled indexes text such as 'Color: Twilight Orange'. Disabled indexes only the value, for example 'Twilight Orange'."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_CHARACTERISTIC_NAMES_LABEL="Index characteristic names"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_DEPENDENT_ATTRIBUTES_DESC="Adds dependent JoomShopping attributes to the searchable text. The index receives the attribute name and selected published attribute value names from product variation rows. Attribute descriptions are not indexed."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_DEPENDENT_ATTRIBUTES_LABEL="Index dependent attributes"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_DEPENDENT_ATTRIBUTE_NAMES_DESC="Controls whether dependent attribute names are added next to selected values. Enabled indexes text such as 'Color: Twilight Orange'. Disabled indexes only selected values."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_DEPENDENT_ATTRIBUTE_NAMES_LABEL="Index dependent attribute names"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_FREE_ATTRIBUTES_DESC="Adds free JoomShopping attributes enabled for the product to the searchable text. The index receives only published free attribute names for the current language. Free attribute descriptions and customer-entered values are not indexed."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_FREE_ATTRIBUTES_LABEL="Index free attributes"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_FREE_ATTRIBUTE_NAMES_DESC="Controls whether published free attribute names are added to the index. Free attributes currently contribute only their names, so disabling this option makes free attributes add no searchable text."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_FREE_ATTRIBUTE_NAMES_LABEL="Index free attribute names"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_INDEPENDENT_ATTRIBUTES_DESC="Adds independent JoomShopping attributes to the searchable text. The index receives the attribute name and selected published attribute value names from independent attribute assignments. Attribute descriptions are not indexed."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_INDEPENDENT_ATTRIBUTES_LABEL="Index independent attributes"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_INDEPENDENT_ATTRIBUTE_NAMES_DESC="Controls whether independent attribute names are added next to selected values. Enabled indexes text such as 'Memory: 8+256 GB'. Disabled indexes only selected values."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_INDEPENDENT_ATTRIBUTE_NAMES_LABEL="Index independent attribute names"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_MANUFACTURER_DESC="Adds the published JoomShopping manufacturer name assigned to the product to the searchable text. Manufacturer pages are not indexed as separate Smart Search results by this option."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_MANUFACTURER_LABEL="Index manufacturer"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_MANUFACTURER_LABEL_TEXT_DESC="Controls whether the manufacturer label is added next to the manufacturer value. Enabled indexes text such as 'Manufacturer: Xiaomi'. Disabled indexes only 'Xiaomi'."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_MANUFACTURER_LABEL_TEXT_LABEL="Index manufacturer label"
PLG_FINDER_WTJOOMSHOPPINGFINDER_XML_DESCRIPTION="Indexes JoomShopping products, characteristics and attributes for Joomla Smart Search."
