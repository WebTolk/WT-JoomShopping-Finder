PLG_FINDER_WTJOOMSHOPPINGFINDER="Умный поиск - товары JoomShopping"
PLG_WTJOOMSHOPPINGFINDER_DESC="<p>Индексирует товары, характеристики и атрибуты JoomShopping для умного поиска Joomla.</p>"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEXED_PRODUCT_FIELDS_DESC="Выберите поля карточки товара JoomShopping, которые будут попадать в индекс умного поиска. Пункт 'Все' включает весь список полей товара. Производитель, характеристики и атрибуты управляются отдельными параметрами ниже."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEXED_PRODUCT_FIELDS_LABEL="Поля товара для индексации"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_CHARACTERISTICS_DESC="Добавляет характеристики товара JoomShopping в поисковый текст. В индекс попадает название характеристики и выбранное/отображаемое значение, которые JoomShopping возвращает для этого товара и текущего языка. Описания характеристик не индексируются."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_CHARACTERISTICS_LABEL="Индексировать характеристики"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_CHARACTERISTIC_NAMES_DESC="Управляет добавлением названий характеристик рядом со значениями. Если включено, индексируется текст вроде 'Цвет: Twilight Orange'. Если выключено, индексируется только значение, например 'Twilight Orange'."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_CHARACTERISTIC_NAMES_LABEL="Индексировать названия характеристик"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_DEPENDENT_ATTRIBUTES_DESC="Добавляет зависимые атрибуты JoomShopping в поисковый текст. В индекс попадает название атрибута и названия выбранных опубликованных значений из строк вариаций товара. Описания атрибутов не индексируются."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_DEPENDENT_ATTRIBUTES_LABEL="Индексировать зависимые атрибуты"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_DEPENDENT_ATTRIBUTE_NAMES_DESC="Управляет добавлением названий зависимых атрибутов рядом с выбранными значениями. Если включено, индексируется текст вроде 'Цвет: Twilight Orange'. Если выключено, индексируются только выбранные значения."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_DEPENDENT_ATTRIBUTE_NAMES_LABEL="Индексировать названия зависимых атрибутов"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_FREE_ATTRIBUTES_DESC="Добавляет свободные атрибуты JoomShopping, включённые у товара, в поисковый текст. В индекс попадают только названия опубликованных свободных атрибутов на текущем языке. Описания свободных атрибутов и введённые покупателем значения не индексируются."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_FREE_ATTRIBUTES_LABEL="Индексировать свободные атрибуты"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_FREE_ATTRIBUTE_NAMES_DESC="Управляет добавлением названий опубликованных свободных атрибутов в индекс. Сейчас свободные атрибуты добавляют только свои названия, поэтому при выключении этой опции они не добавят поисковый текст."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_FREE_ATTRIBUTE_NAMES_LABEL="Индексировать названия свободных атрибутов"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_INDEPENDENT_ATTRIBUTES_DESC="Добавляет независимые атрибуты JoomShopping в поисковый текст. В индекс попадает название атрибута и названия выбранных опубликованных значений из независимых назначений атрибутов. Описания атрибутов не индексируются."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_INDEPENDENT_ATTRIBUTES_LABEL="Индексировать независимые атрибуты"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_INDEPENDENT_ATTRIBUTE_NAMES_DESC="Управляет добавлением названий независимых атрибутов рядом с выбранными значениями. Если включено, индексируется текст вроде 'Память: 8+256 ГБ'. Если выключено, индексируются только выбранные значения."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_INDEPENDENT_ATTRIBUTE_NAMES_LABEL="Индексировать названия независимых атрибутов"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_MANUFACTURER_DESC="Добавляет название опубликованного производителя JoomShopping, назначенного товару, в поисковый текст. Эта опция не индексирует страницы производителей как отдельные результаты умного поиска."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_MANUFACTURER_LABEL="Индексировать производителя"
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_MANUFACTURER_LABEL_TEXT_DESC="Управляет добавлением подписи производителя рядом со значением. Если включено, индексируется текст вроде 'Производитель: Xiaomi'. Если выключено, индексируется только 'Xiaomi'."
PLG_FINDER_WTJOOMSHOPPINGFINDER_FIELD_INDEX_MANUFACTURER_LABEL_TEXT_LABEL="Индексировать подпись производителя"
